							<h2>PROBABLY DON'T NEED 2ND TITLE</h2>
							<p>HERE IS WHERE DA MAP GOES</p>
							<div id="map"></div>
							<script>
								const map = new maplibregl.Map({
									container: 'map', // container id
									style: 'https://demotiles.maplibre.org/style.json', // style URL
									center: [-82.984912, 45.564666], // starting position [lng, lat]
									zoom: 5, // starting zoom
									maplibreLogo: false
								});


								map.on('load', async () => {
									// map.addSource('Marine_Highways', {
									// 	type: 'geojson',
									// 	data: '../data/geodata/NTAD_Marine_Highways.geojson'
									// });
									// map.addLayer({
									// 	id: 'marineHighways',
									// 	type: 'line',
									// 	source: 'Marine_Highways',
									// 	paint: {
									// 		'line-color': '#f72019',
									// 		'line-opacity': 0.8
									// 	}
									// });

									const rDuluthGary = await (await fetch('../data/geodata/arthurmanderson_Duluth_to_Gary_Line_CLEAN.geojson')).json();
									map.addSource('Duluth_to_Gary', {
										type: 'geojson',
										data: { 
											type: 'Feature', 
											geometry: { 
												type: 'LineString', coordinates: [] 
											} 
										}
									});
									map.addLayer({
										id: 'Duluth_to_Gary',
										type: 'line',
										source: 'Duluth_to_Gary',
										paint: {
											'line-color': '#000000',
											'line-width': 5
										}
									})

									// https://maplibre.org/maplibre-gl-js/docs/examples/animate-a-line/
									function animateRoute(sourceDrawTo, coords) {
										const stepSize = 30;
										const interval = 5;

										const cumulativeData = {
											type: 'Feature',
											geometry: { 
												type: 'LineString',
												coordinate: []
											}
										};

										let i = 0;
										let id;

										function frame() {
											if (i < coords.length) { // Not all points drawn yet
												i += stepSize;
												cumulativeData.geometry.coordinates = coords.slice(0, i);
												const src = map.getSource(sourceDrawTo);
												src.setData(cumulativeData);
												id = setTimeout(() => requestAnimationFrame(frame), interval);
											}
										}

										requestAnimationFrame(frame);
									}

									const animDuluthGary = animateRoute('Duluth_to_Gary', rDuluthGary.features[0].geometry.coordinates);


								});
							</script>
