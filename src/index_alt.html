<!DOCTYPE HTML>
<html>
	<head>
		<title>Story by HTML5 UP</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<link rel="stylesheet" href="assets/css/my-custom-styles.css" />
		<noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>
		<script src='https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.js'></script>
		<style>
			#map { width: 100%; height: 500px; }
		</style>
	</head>
	<body class="is-preload">

		<div id="wrapper" class="divided">
            <section class="banner style1 orient-left content-align-left image-position-right fullscreen onload-image-fade-in onload-content-fade-right">
                <div class="content">
                    <h1>US iron ore shipping on the Great Lakes</h1>
                    <p class="major">Adapted from Story theme by <a href="https://html5up.net">HTML5 UP</a>.</p>
                    <!-- <ul class="actions stacked">
                        <li><a href="#first" class="button big wide smooth-scroll-middle">Get Started</a></li>
                    </ul> -->
                </div>
                <div class="image">
                    <img src="images/PaulRTregurtha_by_GusSchauer.jpg" alt="" />
                </div>
            </section>

			<section class="wrapper style1 align-center" id="map-section">
				<div class="inner">
					<h2>Scrollytelling</h2>
					<div id="map"></div>
					<script>
						const map = new maplibregl.Map({
							container: 'map',
							style: 'https://demotiles.maplibre.org/style.json',
							center: [-82.984912, 45.564666],
							zoom: 5,
							maplibreLogo: false
						});

						let routeData;

						map.on('load', async () => {
							routeData = await (await fetch('../data/geodata/arthurmanderson_Duluth_to_Gary_Line_CLEAN.geojson')).json();

							map.addSource('Duluth_to_Gary', {
								type: 'geojson',
								data: { 
									type: 'Feature', 
									geometry: { type: 'LineString', coordinates: [] } 
								}
							});
							map.addLayer({
								id: 'Duluth_to_Gary',
								type: 'line',
								source: 'Duluth_to_Gary',
								paint: { 'line-color': '#000000', 'line-width': 5 }
							});

                            portData = await (await fetch('../data/geodata/USACE_port_and_stat_areas.geojson')).json();
                            map.addSource('USACE_Ports', {
								type: 'geojson',
								data: { 
									type: 'Feature', 
									geometry: { type: 'Polygon', coordinates: [] } 
								}
							});
							map.addLayer({
								id: 'USACE_Ports_fill',
								type: 'fill',
								source: 'USACE_Ports',
								paint: { 'fill-color': '#788bd6'}
							});
                            map.addLayer({
								id: 'USACE_Ports_line',
								type: 'line',
								source: 'USACE_Ports',
								paint: { 'line-color': '#000000', 'line-width': 3}
							});
                            map.getSource('USACE_Ports').setData(portData);
                            // map.getSource('USACE_Ports').setData(portData);
                            
						});

						function animateRoute(coords) {
							const source = map.getSource('Duluth_to_Gary');
							let i = 0;
							function frame() {
								if (i < coords.length) {
									i += 20;
									source.setData({
										type: 'Feature',
										geometry: { type: 'LineString', coordinates: coords.slice(0, i) }
									});
									requestAnimationFrame(frame);
								}
							}
							requestAnimationFrame(frame);
						}

						const obs = new IntersectionObserver(entries => {
							entries.forEach(entry => {
								if (entry.isIntersecting && routeData) {
									animateRoute(routeData.features[0].geometry.coordinates);
									obs.unobserve(entry.target);
								}
							});
						}, { threshold: 0.5 });

						obs.observe(document.querySelector('#map-section'));
					</script>
				</div>
			</section>

			<footer class="wrapper style1 align-center">
				<!-- <div class="inner">
					<p>Adapted from Story theme by <a href="https://html5up.net">HTML5 UP</a>.</p>
				</div> -->
			</footer>
		</div>

		<script src="assets/js/jquery.min.js"></script>
		<script src="assets/js/jquery.scrollex.min.js"></script>
		<script src="assets/js/jquery.scrolly.min.js"></script>
		<script src="assets/js/browser.min.js"></script>
		<script src="assets/js/breakpoints.min.js"></script>
		<script src="assets/js/util.js"></script>
		<script src="assets/js/main.js"></script>
	</body>
</html>
