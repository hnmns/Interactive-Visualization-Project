				function animateRoute(sourceId, coords, targetIndex, speed = 1) {
					const source = map.getSource(sourceId);
					if (!source) return;

					function frame() {
						if (routeProgress < targetIndex) {
							routeProgress += speed;
							if (routeProgress > targetIndex) {
								routeProgress = targetIndex;
							}

							source.setData({
								type: 'Feature',
								geometry: {
									type: 'LineString',
									coordinates: coords.slice(0, routeProgress)
								}
							});

							requestAnimationFrame(frame);
						}
					}

					requestAnimationFrame(frame);
				}

				function buildCargoChart(dataCargo){
					// let width = 300;
					// let height = 200;
					let margin = 28;
					let barwidth = 20;

					// // Fixed SVG size
					// let div_chart = d3
					// 	.select("#map-chart-overlay")
					// 	.append("svg")
					// 	.attr("width", width)
					// 	.attr("height", height)
					// 	.attr("viewBox", "0 0 320 200")
					// 	.style("background-color", "#ffffffcc");
					// Fluid SVG size, fit to its container
					let div_chart = d3
						.select("#map-chart-overlay")
						.append("svg")
						.attr("viewBox", "0 0 320 200")
						.style("width", "100%")
						.style("height", "auto")
						.style("background-color", "#ffffffcc");

					// const xScale = d3.scaleBand(dataCargo.map(c => c.CompletedYear), [0,width]);
					// let yScale = d3.scaleLinear(domain=[0,14944139], range=[height-margin, 0]);

					const xScale = d3.scaleBand(
						dataCargo.map(c => c.CompletedYear),
						[0, width]
					);

					let yScale = d3.scaleLinear()
						.domain([0, 14944139])
						.range([height - margin, 0]);

					div_chart.selectAll("rect")
						.data(dataCargo)
						.join("rect")
							.attr("transform", `translate(${margin/2}, 0)`)
							.attr("x", (d) => xScale(d.CompletedYear))
							.attr("y", (d) => yScale(d.ShortTons))
							.attr("height", (d) => yScale(0) - yScale(d.ShortTons))
							.attr("width", barwidth)
							.attr("fill", "black");

					div_chart.append("g")
						.attr("transform", `translate(${margin/2},${yScale(margin)})`)
						.call(d3.axisBottom(xScale).ticks(3).tickSize(2))
						.style("font-size", "8pt")
						.call(g => g.append("text")
							.attr("transform", `translate(${width/2-margin/2},${margin})`)
							.text("Duluth Outbound Iron Ore Cargoes (short tons)")
							.attr("fill", "black")
							.style("font-size", "8pt")
							// .style("font-size", "8pt")
						);
				}

					let barwidth = 20;

					// Fluid SVG size, fit to its container
					let div_chart = d3
						.select("#map-chart-overlay")
						.append("svg")
						.attr("viewBox", `${-20} ${-20} ${width+2*margin} ${height+2*margin}`)
						.style("width", "100%")
						.style("height", "auto")
						.style("background-color", "#ffffff00");

					// https://observablehq.com/@d3/stacked-bar-chart/2
					const keys = Array.from(new Set(dataCargo.map(d => d.WaterwayName)));
					// Reformat data to have entries like: {CompletedYear: {CompletedYear: [WaterwayName,CompletedYear,ShortTons]} }
					const indexed = d3.index(
						dataCargo,
						d => d.CompletedYear,
						d => d.WaterwayName
					);
					console.log(indexed);

					const series = d3.stack()
						.keys(keys)
						.value(([, map], key) => map.get(key)?.ShortTons || 0)
						(indexed);
					// const series = d3.stack()
					// 	.keys(d3.union(dataCargo.map(d => d.WaterwayName))) // distinct series keys, in input order
					// 	.value(([, D], key) => D.get(key).ShortTons) // get value for each series key and stack
					// 	(d3.index(dataCargo, d => d.CompletedYear, d => d.WaterwayName)); // group by stack then series key

					const xScale = d3.scaleBand(
						Array.from(indexed.keys()),
						[0, width]
					).padding(0.1);
					// const xScale = d3.scaleBand(
					// 	dataCargo.map(c => c.CompletedYear),
					// 	[0, width]
					// );

					const yScale = d3.scaleLinear()
						.domain([0, d3.max(series[series.length - 1], d => d[1])])
						.nice()
						.range([height, 0]);
					// let yScale = d3.scaleLinear()
					// 	.domain([0, 14944139])
					// 	.range([height - margin, 0]);

					const color = d3.scaleOrdinal()
						.domain(keys)
						.range(keys.map(k => portColors[k] || portColors.default));
					// const color = d3.scaleOrdinal()
					// 	.domain(keys)
					// 	.range(d3.schemeDark2);


					div_chart.append("g")
						.attr("transform", `translate(${margin},0)`)
						.selectAll("g")
						.data(series)
						.join("g")
							.attr("fill", d => color(d.key))
						.selectAll("rect")
						.data(d => d)
						.join("rect")
							.attr("x", d => xScale(d.data[0]))
							.attr("y", d => yScale(d[1]))
							.attr("height", d => yScale(d[0]) - yScale(d[1]))
							.attr("width", xScale.bandwidth());
					// div_chart.selectAll("rect")
					// 	.data(dataCargo)
					// 	.join("rect")
					// 		.attr("transform", `translate(${margin/2}, 0)`)
					// 		.attr("x", (d) => xScale(d.CompletedYear))
					// 		.attr("y", (d) => yScale(d.ShortTons))
					// 		.attr("height", (d) => yScale(0) - yScale(d.ShortTons))
					// 		.attr("width", barwidth)
					// 		.attr("fill", "black");

					// x Axis
					div_chart.append("g")
					.attr("transform", `translate(${margin},${yScale(margin)})`)
					.call(d3.axisBottom(xScale).tickSize(3))
					.style("font-size", "10pt")
					.call(g => g.append("text")
						.attr("transform", `translate(${width/2},${margin})`)
						.text("Outbound Iron Ore Cargoes from USACE Ports")
						.attr("fill", "black")
						.style("font-size", "12pt")
						.style("font-weight", "bold")
					);

					// y Axis
					div_chart.append("g")
						.attr("transform", `translate(${margin},${0})`)
						.call(d3.axisLeft(yScale)
							.tickSize(3)
							.tickFormat(d3.format(".2s")))
						.style("font-size", "10pt")
						.call(g => g.append("text")
							.attr("transform", `translate(${-margin},${(height-2*margin)/2})rotate(-90)`)
							.text("Tonnage (short tons)")
							.attr("fill", "black")
							.style("font-size", "12pt")
							// .style("font-size", "8pt")
						);
				}

				function drawPictograph(tripCount) {
					const iconSize = 12;    // size of each icon
					const columns = 20;     // how many icons per row
					const padding = 4;

					const rows = Math.ceil(tripCount / columns);
					const width = columns * (iconSize + padding);
					const height = rows * (iconSize + padding);

					const svg = d3.select("#pictograph")
						.html("")
						.append("svg")
						.attr("width", width)
						.attr("height", height);

					const countData = d3.range(tripCount);

					svg.selectAll("image")
						.data(countData)
						.join("image")
							.attr("href", "images/placeholder_icon_NATD.svg")
							.attr("x", d => (d % columns) * (iconSize + padding))
							.attr("y", d => Math.floor(d / columns) * (iconSize + padding))
							.attr("width", 0)
							.attr("height", 0)
							// .attr("cx", d => (d % columns) * (iconSize + padding) + iconSize/2)
							// .attr("cy", d => Math.floor(d / columns) * (iconSize + padding) + iconSize/2)
							// .attr("r", 0)
							// .attr("fill", "#4a6fa5")
						.transition()
							.delay((d, i) => i * 5)
							.duration(200)
							.attr("width", iconSize)
							.attr("height", iconSize);
							// .attr("r", iconSize/2);
				}

				function animateSooLocksPictograph(shipCount) {
  
					const width = 600;
					const height = 500;

					const iconSize = 10;
					const padding = 6;

					const svg = d3.select("#pictograph-locks")
						.html("")
						.append("svg")
						.attr("width", width)
						.attr("height", height);

					const data = d3.range(shipCount);

					const outboundCols = 10;
					const inboundCols = 10;
					const lockCols = 5;   // bottleneck!

					// Outbound grid (left)
					function posOutbound(i) {
						return {
							x: 50 + (i % outboundCols) * (iconSize + padding),
							y: 40+ Math.floor(i / outboundCols) * (iconSize + padding)
						};
					}

					// Lock squeeze position (middle)
					function posLock(i) {
						return {
							x: width / 2,
							y: 180 + (i % lockCols) * (iconSize + padding)
						};
					}

					// Inbound grid (right)
					function posInbound(i) {
						return {
							x: width - 200 + (i % inboundCols) * (iconSize + padding),
							y: 250 + Math.floor(i / inboundCols) * (iconSize + padding)
						};
					}

					// Create circles
					const ships = svg.selectAll("circle")
						.data(data)
						.join("circle")
							.attr("r", 0)
							.attr("fill", "#4477aa")
							.attr("cx", d => posOutbound(d).x)
							.attr("cy", d => posOutbound(d).y);

					// Stage 1 — appear in outbound grid
					ships.transition()
						.delay((d, i) => i * 5)
						.duration(800)
						.attr("r", iconSize / 2)
						.transition()
						.duration(800)
						.attr("cx", d => posLock(d).x - 50)
						.attr("cy", d => posLock(d).y)
						.transition()
						.duration(1200)
						.attr("cx", d => posLock(d).x)
						.attr("cy", d => posLock(d).y)
						.transition()
						.duration(800)
						.attr("cx", d => posInbound(d).x)
						.attr("cy", d => posInbound(d).y)
						.transition()
						.duration(300)
						.attr("fill", "#66aa55");
				}
				

				window.addEventListener('resize', scroller.resize);
