<!DOCTYPE HTML>
<html>
	<head>
		<title>US Domestic Iron</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<link rel="stylesheet" href="assets/css/my-custom-styles.css" />
		<noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>
		<script src='https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.js'></script>
		<script src="scrollama.js" type="text/javascript"></script>
		<body class="is-preload">

		<!-- Below, Story template item formatting that breaks the scroll-then-sticky map effect -->
		<!-- <div id="wrapper" class="divided"> --> 
            <section class="banner style1 orient-left content-align-left image-position-right fullscreen onload-image-fade-in onload-content-fade-right">
                <div class="content">
                    <h1>US iron ore shipping on the Great Lakes</h1>
                    <p class="major">MOVE TO END Adapted from Story theme by <a href="https://html5up.net">HTML5 UP</a>.</p>
                </div>
                <div class="image">
                    <img src="images/PaulRTregurtha_by_GusSchauer.jpg" alt="" />
                </div>
            </section>

			<h2>Scrollytelling</h2>

			<div id="scrolly-wrapper">
				<section id="scrolly">
					<article id="sidebar">
						<div class="step" data-lng="-110.08" data-lat="39.58" data-zoom="3">Iron in the US</div>
						<div class="step" data-lng="-91.5" data-lat="46.78" data-zoom="7">Duluth-Superior</div>
						<div class="step" data-lng="-88.03" data-lat="46.32" data-zoom="6">Major Outbound Ports</div>
						<div class="step" data-lng="-84.34" data-lat="46.25" data-zoom="7">Soo Locks</div>
						<div class="step" data-lng="-86.95" data-lat="42.0" data-zoom="8">Indiana Harbor</div>
						<div class="step" data-lng="-84.75" data-lat="43.87" data-zoom="6">Major Inbound Ports</div>
					</article>

					<script
						src="https://www.unpkg.com/turf@2.0.0/turf.min.js"
						charset="utf-8"
					></script>

					<figure id="map-container">
						<div id="map"></div>
						<div id="overlay-container">
							<div id="map-text-overlay">MAP OVERLAY TEXT PLACEHOLDER</div>
							<div id="map-chart-overlay">MAP OVERLAY CHART PLACEHOLDER</div>
						</div>

					</figure>
				</section>
			</div>

			<script>
				const map = new maplibregl.Map({
					container: 'map',
					style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
					// https://tiles.openfreemap.org/styles/positron
					center: [-98.50, 39.50],
					zoom: 1,
					maplibreLogo: false,
					interactive: false
				});

				let routeData;

				// Globals
				let duluthGaryCoords = null;
				const text_overlay_list = [
					`
					For years, seven open-pit mines in Minnesota and Michigan have accounted for 
					<strong style="color:#C46F60;">effectively* 100%</strong> of domestic US iron ore production.

					<span style="display:block; font-size:0.75em; color:#666; margin-top:0.6em;">
						*Utah intermittently appears on U.S. Geological Survey's Mineral Commodity Summaries, with mining operations in the state being suspended as recently as 2025.
					</span>
					`,
					`
					Talk about Duluth-Superior
					`,
					`
					Talk about outbound port for iron ore shipping
					`,
					`
					Talk about Soo Locks
					`,
					`
					Talk about Burns? IN Harbor? I forgot.
					`,
					`
					Talk about inbound ports.
					`,
					`
					SUMMARIZE ME
					`
				]
				

				// AI Use (ChatGPT): "Preferred approach for scrollytelling with scrollama and maplibre events?" 
				// Using Scrollama to trigger maplibre flyto() events:
					// https://github.com/digidem/maplibre-storymap/tree/main
				const scroller = scrollama();
				map.on('load', async () => {

					// Prevent my layers from covering up basemap city names
					map.on('styledata', () => {
						const layers = map.getStyle().layers;

						layers.forEach(l => {
							if (l.type === 'symbol') {
							try {
								map.moveLayer(l.id);
							} catch (_) {}
							}
						});
					});

					// Real Arthur M. Anderson route from Duluth to Gary in 2021
					routeData = await (await fetch('data/geodata/arthurmanderson_Duluth_to_Gary_Line_CLEAN.geojson')).json();
					duluthGaryCoords = routeData.features[0].geometry.coordinates;
					map.addSource('Duluth_to_Gary', {
						type: 'geojson',
						data: { 
							type: 'Feature', 
							geometry: { type: 'LineString', coordinates: [] } 
						}
					});
					map.addLayer({
						id: 'Duluth_to_Gary',
						type: 'line',
						source: 'Duluth_to_Gary',
						paint: { 'line-color': '#000000', 'line-width': 5 }
					});


					portData = await (await fetch('data/geodata/USACE_port_and_stat_areas.geojson')).json();
					map.addSource('USACE_Ports', {
						type: 'geojson',
						data: { 
							type: 'Feature', 
							geometry: { type: 'Polygon', coordinates: [] } 
						}
					});
					map.addLayer({
						id: 'USACE_Ports_fill',
						type: 'fill',
						source: 'USACE_Ports',
						paint: { 
							'fill-color': '#C46F60',
							'fill-opacity': 0.0
						}
					});
					map.addLayer({
						id: 'USACE_Ports_line',
						type: 'line',
						source: 'USACE_Ports',
						paint: { 
							'line-color': '#000000', 
							'line-opacity': 0.0,
							'line-width': 2,
							'line-dasharray': [2, 3]
						}
					});
					map.getSource('USACE_Ports').setData(portData);

					// Highlight Minnesota and Michigan
					mnmiData = await (await fetch('data/geodata/minnesota_michigan_borders.geojson')).json();
					map.addSource("mnmi", {
						type: "geojson",
						data:  {
							type: "Feature",
							geometry: {
								type: "Polygon",
								coordinates: []
							}
						}
					});
					map.addLayer({
						id: "mnmi-fill",
						type: "fill",
						source: "mnmi",
						paint: {
							'fill-color': '#C46F60',
							'fill-opacity': 0.0
						}
					});
					map.getSource('mnmi').setData(mnmiData);

					// Highlight USA, darken/fade out rest of world
					usaData = await (await fetch('data/geodata/us_lower_48.geojson')).json();
					map.addSource("nonusa-mask", {
						type: "geojson",
						data:  {
							type: "Feature",
							geometry: {
								type: "Polygon",
								coordinates: [
									[
										[-180, -90],
										[180, -90],
										[180, 90],
										[-180, 90],
										[-180, -90]
									],
									usaData.features[0].geometry.coordinates[0]
								]
							}
						}
					});
					map.addLayer({
						id: "nonusa-fade",
						type: "fill",
						source: "nonusa-mask",
						paint: {
							'fill-color': '#000000',
							'fill-opacity': 0.15
						}
					});
					

					usacanData = await (await fetch('data/geodata/usa_can_border.geojson')).json();
					map.addSource('usa_can_border',{
						type: 'geojson',
						data: usacanData
					});
					map.addLayer({
						id: 'usa_can_border_line',
						type: 'line',
						source: 'usa_can_border',
						paint: {
							'line-color': 'black',
							'line-opacity': 0.0
						}
					})

					map.setPaintProperty('nonusa-fade', 'fill-opacity-transition', { duration: 2500 });
					map.setPaintProperty('mnmi-fill', 'fill-opacity-transition', { duration: 2500 });
					map.setPaintProperty('USACE_Ports_fill', 'fill-opacity-transition', { duration: 2500 });
					map.setPaintProperty('usa_can_border_line', 'line-opacity-transition', { duration: 2500 });

					scroller
						.setup({
							step: ".step", // elements that trigger scroll
							offset: 0.50,   // trigger at X% viewport height
							debug: false,  // set true to visualize trigger positions
						})
						.onStepEnter((response) => {
							// Highlighting current step in the sidebar
							const step = response.element;
							document.querySelectorAll(".step").forEach(s => s.classList.remove("is-active"));
							step.classList.add("is-active");

							// Scroll sections
							const i = response.index;
							const text_overlay = document.getElementById('map-text-overlay');
							text_overlay.innerHTML = text_overlay_list[i];
							console.log(text_overlay_list[i]);
							// Step 1: Full USA view, highlighting MN and MI, lowlight rest of world
							if (i === 0) {
								map.setPaintProperty('nonusa-fade', 'fill-opacity', 0.15);
								map.setPaintProperty('mnmi-fill', 'fill-opacity', 0.65);
								map.setPaintProperty('usa_can_border_line', 'line-opacity', 0.0);
								map.setPaintProperty('USACE_Ports_fill', 'fill-opacity', 0.0)
								map.setPaintProperty('USACE_Ports_line', 'line-opacity', 0.0)

								text_overlay.classList.add('visible');

								animateRoute('Duluth_to_Gary', duluthGaryCoords);
							}
							// Step 2: Duluth and USACE port zones
							else if (i === 1) {
								map.setPaintProperty('nonusa-fade', 'fill-opacity', 0.025);
								map.setPaintProperty('mnmi-fill',   'fill-opacity', 0.1);
								map.setPaintProperty('usa_can_border_line', 'line-opacity', 0.65);	
								// map.setPaintProperty('mnmi-fill', 'fill-opacity', 0.65);
								map.setPaintProperty('USACE_Ports_fill', 'fill-opacity', 0.5)
								map.setPaintProperty('USACE_Ports_line', 'line-opacity', 0.5)

								// document.getElementById('map-text-overlay').classList.remove('visible');
								// console.log(text_overlay_list[i]);
								// const animDuluthGary = animateRoute('Duluth_to_Gary', routeData.features[0].geometry.coordinates);
							}
							// Step 3: Major Outbound ports
							else if (i === 2) {
								
								// map.setPaintProperty('mnmi-fill', 'fill-opacity', 0.0);
							}
							// Step 4: Soo Locks
							else if (i === 3) {
								// map.setPaintProperty('mnmi-fill', 'fill-opacity', 0.0);
							}
							// Step 5: Inbound ports
							else if (i === 4) {
								// map.setPaintProperty('mnmi-fill', 'fill-opacity', 0.0);
							}
							// Step 6: Summary
							else if (i === 5) {
								// map.setPaintProperty('mnmi-fill', 'fill-opacity', 0.0);
							}

							// Map zoom events
							const lng = parseFloat(step.dataset.lng);
							const lat = parseFloat(step.dataset.lat);
							const zoom = parseFloat(step.dataset.zoom);
							map.flyTo({
								center: [lng, lat],
								zoom: zoom,
								speed: 0.4,
								curve: 1.2,
								essential: true,
							});
						})
						.onStepExit((response) => {
							// exit events
						});

					

				});

				
				function animateRoute(sourceId, coords) {
					const source = map.getSource(sourceId);
					let i = 0;
					function frame() {
						if (i < coords.length) {
							i += 20;
							source.setData({
								type: 'Feature',
								geometry: { type: 'LineString', coordinates: coords.slice(0, i) }
							});
							requestAnimationFrame(frame);
						}
					}
					requestAnimationFrame(frame);
				}

				window.addEventListener('resize', scroller.resize);


			</script>
		<!-- </div> -->

		<script src="assets/js/jquery.min.js"></script>
		<script src="assets/js/jquery.scrollex.min.js"></script>
		<script src="assets/js/jquery.scrolly.min.js"></script>
		<script src="assets/js/browser.min.js"></script>
		<script src="assets/js/breakpoints.min.js"></script>
		<script src="assets/js/util.js"></script>
		<script src="assets/js/main.js"></script>
	</body>
</html>
